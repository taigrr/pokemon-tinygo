name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'Run gofmt:'; gofmt -l .; exit 1; }
      - name: goimports
        run: test -z "$(goimports -l .)" || { echo 'Run goimports:'; goimports -l .; exit 1; }
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: staticcheck ./...
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  cmd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/gopherbadgeimg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'Run gofmt'; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: staticcheck ./...
      - run: go build ./...
      - run: go test -race ./...

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.41.1"
      - name: TinyGo build (badger2040-w)
        run: tinygo build --target=badger2040-w -o /tmp/main.uf2 .
