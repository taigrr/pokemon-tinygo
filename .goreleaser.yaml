# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2

project_name: gopherbadgeimg

before:
  hooks:
    - cmd: go mod tidy
      dir: cmd/gopherbadgeimg

builds:
  - id: gopherbadgeimg
    dir: cmd/gopherbadgeimg
    main: .
    binary: gopherbadgeimg
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - cmd/gopherbadgeimg/README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"

release:
  github:
    owner: taigrr
    name: pokemon-tinygo
  name_template: "v{{ .Version }}"
